# Shared rate-limit zones. Lives in conf.d as a plain config (not a template): the zones belong to
# the http context and must be declared exactly once, while the site template only references them.
# The 00- prefix keeps it first in nginx's alphabetical include of conf.d/*.conf.

# Checkout. Nothing is reserved (ADR-0001), but every order asks Plisio for an invoice, so this is
# the endpoint that costs us on the other side.
limit_req_zone $binary_remote_addr zone=checkout:10m rate=10r/m;

# Re-sending download links. Each request sends an e-mail, so it is an outbound spam vector.
limit_req_zone $binary_remote_addr zone=maillinks:10m rate=5r/m;

# 503 reads as "we are broken", 429 as "slow down".
limit_req_status 429;
